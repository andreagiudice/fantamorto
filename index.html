<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantamorto Roma 2025</title>
<style>
:root{box-sizing:border-box;--bg:#2a1f42;--bg2:#3a2a5c;--card:#241a3a;--tx:#f4eefb;--mut:#b6a8d1;--line:#4d3c72;--gold:#e8c34a}
@media (prefers-color-scheme:light){:root{--bg:#e9defa;--bg2:#f3ecff;--card:#ffffff;--tx:#2b2233;--mut:#6d6379;--line:#d9cfe4}}
*{box-sizing:border-box}
body{margin:0 auto;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:640px;min-height:100vh}
h1{font-size:1.6rem;margin:.1em 0 .05em;letter-spacing:1px;text-align:center;font-weight:800}
.tagline{text-align:center;color:var(--mut);font-size:.8rem;margin-bottom:20px;letter-spacing:.5px;text-transform:uppercase}
h2{font-size:1.05rem;margin:1.4em 0 .5em}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
input,button{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
input{width:100%;margin:4px 0}
button{cursor:pointer;background:#8b5fd6;color:#fff;border:none;font-weight:600}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:500;padding:4px 8px;font-size:.8rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 130px}
.role{border-radius:12px;padding:10px 12px;margin:8px 0;border:2px solid;color:#2b2233}
.role h3{margin:0 0 2px;font-size:.8rem;text-transform:uppercase;letter-spacing:1px}
.role .cond{font-size:.72rem;opacity:.7}
.pick{margin-top:6px;font-weight:600}
.dead{text-decoration:line-through;opacity:.65}
.tag{font-size:.75rem;color:var(--mut)}
.wrap{overflow-x:auto}

.lbcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:transform .1s}
.lbcard:active{transform:scale(.98)}
.rank{width:26px;text-align:center;font-weight:800;color:var(--mut);flex:0 0 auto}
.rank.gold{color:var(--gold);font-size:1.2rem}
.avatar{width:52px;height:52px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:#fff;border:2px solid rgba(255,255,255,.25)}
.lbname{flex:1 1 auto;font-weight:700;font-size:1.02rem}
.lbpts{font-weight:800;font-size:1.15rem;color:var(--gold)}
.lbpts small{display:block;font-size:.62rem;font-weight:500;color:var(--mut);text-align:right}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.tabbtn{padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:700;cursor:pointer}
.tabbtn.active{background:#8b5fd6;color:#fff;border-color:#8b5fd6}
.rules h3{margin:1.1em 0 .2em}
.rules p{margin:.2em 0;color:var(--mut);font-size:.92rem}
</style>
</head>
<body>
<h1>⚰️ FANTAMORTO ROMA</h1>
<div class="tagline">Classifica squadre</div>

<div class="tabs">
  <button class="tabbtn active" id="tabLB">Classifica</button>
  <button class="tabbtn" id="tabRules">Regolamento</button>
</div>

<div class="row" style="max-width:220px;margin:0 auto 16px" id="editionWrap">
  <select id="edition">
    <option value="2025">Edizione 2025</option>
    <option value="2026">Edizione 2026</option>
  </select>
</div>

<div class="tag" id="status" style="display:none;margin-bottom:10px"></div>

<div class="box" id="addBox" style="display:none">
  <div class="row">
    <input id="tname" placeholder="Nome della tua squadra">
    <button id="add" style="flex:0 0 auto">Crea squadra</button>
  </div>
</div>

<div id="listView">
  <div id="lb"></div>
</div>

<div id="detailView" style="display:none">
  <button class="sec" id="back" style="margin-bottom:10px">← Classifica</button>
  <div id="teamDetail"></div>
</div>

<div id="rulesView" class="box rules" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== INCOLLA QUI I TUOI DUE VALORI DI SUPABASE ====== */
const SUPABASE_URL = "https://slddeienezzvgyanmjrz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsZGRlaWVuZXp6dmd5YW5tanJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTc1OTIsImV4cCI6MjEwNTQ3MzU5Mn0.tt8_iowU1hzsq2ikRKAQV2k3nDgK7-q5IqB8pLh-6po";
/* ======================================================= */

const ROLES=[
 {k:"capitano",n:"Capitano",c:"Nessuna condizione",m:3,col:"#c9a227",bg:"#f6efdc"},
 {k:"patriota",n:"Patriota",c:"Italiano · Over 68",m:2,col:"#3b6ea5",bg:"#dce8f5"},
 {k:"giovane",n:"Così giovane!",c:"Under 40",m:2,col:"#5a9bd4",bg:"#dceaf7"},
 {k:"ritardo",n:"Scusate il ritardo",c:"Over 90",m:2,col:"#6b6b6b",bg:"#e2e2e2"},
 {k:"rosa",n:"Quota rosa",c:"Donna",m:1,col:"#b5537a",bg:"#f4dde7"},
 {k:"ohno",n:"Oh Noooo",c:"Augurato dal profondo del cuore",m:1,col:"#d2762b",bg:"#fae2cd"}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
let sb=null, teams=[];

const pOf=(r,p)=>(!p||!p.dead||p.age===""||p.age==null)?0:Math.max(0,100-Number(p.age))*r.m;
const tot=t=>ROLES.reduce((s,r)=>s+pOf(r,(t.picks||{})[r.k]),0);

let openTeam=null;

const AVATAR_COLORS=["#c9a227","#3b6ea5","#5a9bd4","#b5537a","#6b6b6b","#d2762b","#4c9a7a","#8b5fd6","#c0503f"];
function colorFor(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0; return AVATAR_COLORS[h%AVATAR_COLORS.length]; }
const MEDALS=["🥇","🥈","🥉"];

let currentEdition=localStorage.getItem("fm_edition")||"2025";

function teamsInEdition(){ return teams.filter(t=>(t.edition||"2025")===currentEdition); }

function renderList(){
  const lb=teamsInEdition().sort((a,b)=>tot(b)-tot(a));
  $("#lb").innerHTML=lb.length?lb.map((t,i)=>{
    const initials=esc(t.name).slice(0,2).toUpperCase();
    const rank=i<3?`<span class="rank gold">${MEDALS[i]}</span>`:`<span class="rank">${i+1}</span>`;
    return `<div class="lbcard" data-open="${t.id}">
      ${rank}
      <div class="avatar" style="background:${colorFor(t.name)}">${initials}</div>
      <div class="lbname">${esc(t.name)}</div>
      <div class="lbpts">${tot(t)}<small>punti</small></div>
    </div>`;
  }).join("")
    :`<div class="box" style="text-align:center;color:var(--mut)">Nessuna squadra ancora.</div>`;
}

function renderDetail(id){
  const t=teams.find(x=>x.id===id);
  if(!t){ showList(); return; }
  $("#teamDetail").innerHTML=`<div class="box"><div class="row" style="align-items:center">
    <div class="avatar" style="background:${colorFor(t.name)};flex:0 0 auto">${esc(t.name).slice(0,2).toUpperCase()}</div>
    <h2 style="margin:0;flex:1 1 auto">${esc(t.name)} — ${tot(t)} pt</h2>
    <button class="sec" style="flex:0 0 auto" data-del="${t.id}">Elimina</button></div>`+
    ROLES.map(r=>{const p=(t.picks||{})[r.k]||{};return `<div class="role" style="border-color:${r.col};background:${r.bg}">
      <h3 style="color:${r.col}">${r.n} ×${r.m}</h3><div class="cond">${r.c}</div>
      <div class="pick ${p.dead?"dead":""}">${p.name?esc(p.name):"<i style='opacity:.5'>libero</i>"} ${p.dead?"† "+p.age+" anni · "+pOf(r,p)+" pt":""}</div>
      <div class="row" style="margin-top:6px">
        <input placeholder="Personaggio" value="${p.name?esc(p.name):""}" data-t="${t.id}" data-r="${r.k}" data-f="name">
        <input type="number" placeholder="Età" value="${p.age!=null?p.age:""}" data-t="${t.id}" data-r="${r.k}" data-f="age" style="flex:0 0 80px">
        <button class="sec" style="flex:0 0 auto" data-dead="${t.id}|${r.k}">${p.dead?"↩︎ Vivo":"✝ Morto"}</button>
      </div></div>`}).join("")+"</div>";
}

function showList(){ openTeam=null; $("#listView").style.display=""; $("#detailView").style.display="none"; renderList(); }
function showDetail(id){ openTeam=id; $("#listView").style.display="none"; $("#detailView").style.display=""; renderDetail(id); }

function render(){
  renderList();
  if(openTeam) renderDetail(openTeam);
}

function showError(msg){ const s=$("#status"); s.textContent=msg; s.style.display=""; s.style.color="#c0392b"; }
function clearError(){ const s=$("#status"); s.style.display="none"; }

async function save(t){
  if(!sb) return;
  const {error}=await sb.from("teams").upsert({id:t.id,name:t.name,edition:t.edition||"2025",picks:t.picks||{}});
  if(error) showError("Errore salvataggio: "+error.message); else clearError();
}
async function load(){
  const {data,error}=await sb.from("teams").select("*");
  if(error){showError("Errore di connessione: "+error.message);return}
  teams=data||[]; clearError(); render();
}

document.addEventListener("click",async e=>{
  const row=e.target.closest("[data-open]");
  if(row){ showDetail(row.dataset.open); return; }
  if(e.target.id==="back"){ showList(); return; }
  const d=e.target.dataset;
  if(d.del){ teams=teams.filter(x=>x.id!==d.del); showList(); if(sb) await sb.from("teams").delete().eq("id",d.del); }
  if(d.dead){ const[id,rk]=d.dead.split("|"); const t=teams.find(x=>x.id===id);
    t.picks=t.picks||{}; t.picks[rk]=t.picks[rk]||{name:"",age:""}; t.picks[rk].dead=!t.picks[rk].dead; render(); save(t); }
});
document.addEventListener("change",e=>{
  const d=e.target.dataset; if(!d.t)return;
  const t=teams.find(x=>x.id===d.t); t.picks=t.picks||{}; t.picks[d.r]=t.picks[d.r]||{name:"",age:""};
  t.picks[d.r][d.f]=e.target.value; render(); save(t);
});
function renderRules(){
  $("#rulesView").innerHTML=`
    <h2 style="margin-top:0">Regolamento</h2>
    <p>Ogni squadra schiera 6 personaggi, uno per ruolo. Ogni ruolo ha una condizione da rispettare e un moltiplicatore.</p>
    <p><b>Punteggio:</b> quando un personaggio muore, la squadra guadagna (100 − età alla morte) × moltiplicatore del ruolo.</p>
    ${ROLES.map(r=>`<h3 style="color:${r.col}">${r.n} — ×${r.m}</h3><p>${r.c}</p>`).join("")}
  `;
}

function setTab(tab){
  const lb=tab==="lb";
  $("#tabLB").classList.toggle("active",lb);
  $("#tabRules").classList.toggle("active",!lb);
  $("#editionWrap").style.display=lb?"":"none";
  $("#addBox").style.display=lb&&currentEdition==="2026"?"":"none";
  $("#rulesView").style.display=lb?"none":"";
  if(lb){ showList(); } else { $("#listView").style.display="none"; $("#detailView").style.display="none"; renderRules(); }
}
$("#tabLB").onclick=()=>setTab("lb");
$("#tabRules").onclick=()=>setTab("rules");
  $("#edition").value=currentEdition;
  $("#addBox").style.display=currentEdition==="2026"?"":"none";
  render();
}
$("#edition").onchange=e=>{ currentEdition=e.target.value; localStorage.setItem("fm_edition",currentEdition); showList(); applyEdition(); };

$("#add").onclick=()=>{const n=$("#tname").value.trim(); if(!n)return;
  const t={id:"t"+Date.now()+Math.floor(Math.random()*999),name:n,edition:currentEdition,picks:{}};
  teams.push(t); $("#tname").value=""; render(); save(t);};

applyEdition();
setTab("lb");
try{
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  load();
  sb.channel("teams-live").on("postgres_changes",{event:"*",schema:"public",table:"teams"},load).subscribe();
}catch(e){ showError("Supabase non configurato: controlla URL e chiave."); }
</script>
<footer style="text-align:center;margin-top:32px;padding:16px 0 8px;color:var(--mut);font-size:.75rem;line-height:1.6;border-top:1px solid var(--line)">
  Fantamorto Roma 2025 · Regole a cura del gruppo<br>
  App creata con l'aiuto di Claude<br>
  Che vinca il migliore (o il più spietato) 💀
</footer>

</body>
</html>
